name: Build And Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/paradox1612/medusa-backend:sha-${{ github.sha }}
            ghcr.io/paradox1612/medusa-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update image tag in homelab-gitops (Argo deploys)
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$GITOPS_TOKEN" | tr -d '[:space:]')"
          git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/paradox1612/homelab-gitops.git" gitops
          cd gitops
          sed -i "s#ghcr.io/paradox1612/medusa-backend:[^\"'[:space:]]*#ghcr.io/paradox1612/medusa-backend:sha-${{ github.sha }}#g" apps/medusa/backend.yaml
          git config user.name "medusa-backend[bot]"
          git config user.email "ci@thekush.dev"
          git add apps/medusa/backend.yaml
          if git diff --cached --quiet; then echo "no manifest change"; exit 0; fi
          git commit -m "deploy(medusa-backend): sha-${{ github.sha }}"
          for i in 1 2 3 4 5; do git push && break || { git pull --rebase --autostash; sleep $((RANDOM % 6 + 2)); }; done
